server:
  shutdown: graceful  # 开启优雅停机[reference:0][reference:1]
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s # 设置最大等待时间，默认30秒[reference:2][reference:3]
  autoconfigure:
    exclude:
      - org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration
      - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration
      - org.springframework.ai.mcp.client.webflux.autoconfigure.SseWebFluxTransportAutoConfiguration
      - org.springframework.ai.mcp.client.webflux.autoconfigure.StreamableHttpWebFluxTransportAutoConfiguration
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/super-big-agent?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: root
    password: zhj123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}  # 从环境变量读取
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
      
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: false
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/0502948d0630daec # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY}  # 从环境变量读取（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

ai:
  model-routing:
    fast-model: qwen-turbo
    balanced-model: qwen-plus
    reasoning-model: qwen-plus
    fast:
      temperature: 0.2
      max-token: 512
      top-p: 0.7
    balanced:
      temperature: 0.5
      max-token: 2000
      top-p: 0.9
    reasoning:
      temperature: 0.3
      max-token: 8000
      top-p: 0.8
    intent:
      chitchat: fast
      time-query: fast
      system-operation: fast
      knowledge-qa: balanced
      log-query: balanced
      metrics-query: balanced
      ambiguous: balanced
      alert-diagnosis: reasoning
    task:
      intent-classification: fast
      query-rewrite: fast
      persona-extraction: fast
      memory-summary: fast
      aiops-report: reasoning

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 4  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称 实际没有使用（用的默认的qwen-plus）
  query-rewrite:
    enabled: true
    llm-enabled: true
    llm-max-token: 256
    max-context-chars: 80
    max-rewritten-chars: 160
  evaluation:
    enabled: false  # 离线检索测评集总开关：开发/正常聊天建议关闭，需要评测 hit@k、MRR 时再打开
    log-no-labels: false  # 开启后，未命中测评样本的问题也会写评测日志；日志较多，调试时可改为 false
    dataset-location: classpath:retrieval-eval.json  # 可切换为其他离线测评集路径，例如 file:./eval/retrieval-eval.json
  sync:
    enabled: true  # RAG 知识库增量同步：新增/修改/删除文档后自动更新向量库
    interval-ms: 60000
    initial-delay-ms: 30000
    index-file: ./data/rag-document-index.json
    source-paths:
      - ./aiops-docs
      - ./uploads
    allowed-extensions:
      - md
      - markdown
      - txt
  rerank:
    enabled: true  # 是否启用检索结果重排
    candidate-top-k: 8  # 先召回候选数量，再重排截断到 rag.top-k
    vector-weight: 0.7  # 向量相似度权重
    keyword-weight: 0.3  # 关键词覆盖率权重
    min-relevance-score: 0.22  # 最低相关阈值（低于该分值会被过滤）

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: true  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）


management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    health:
      show-details: always

session:
  storage:
    persona-path: ./data/personas
    redis-ttl: 24h
    redis-max-messages: 20
    compression-interval: 0
    compression-token-threshold: 2000
    compression-min-messages: 2
    llm-context-window: 10
    semantic-top-k: 3
    db-page-size: 20

persona:
  extraction:
    enabled: true
    llm-enabled: true
    interval-rounds: 5
    min-new-messages: 6
    min-confidence: 0.65
    max-analysis-messages: 12

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: "SuperBizAgent-JWT-Secret-Key-2026-Must-Be-At-Least-256-Bits-Long!!"
  expiration: 86400
